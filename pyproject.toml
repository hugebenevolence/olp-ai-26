[project]
name = "olp-ai-26"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "polars>=1.0",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "pyarrow>=17.0",
    "tqdm>=4.66",
    "pyyaml>=6.0",
    "torch>=2.7",
    "torchvision>=0.22",
    "torchaudio>=2.7",
    "pillow>=10.4",
    "opencv-python-headless>=4.10",
    "scikit-image>=0.24",
    "albumentations>=2.0",
    "timm>=1.0",
    "ultralytics>=8.3",
    "segmentation-models-pytorch>=0.4",
    "transformers>=4.45",
    "datasets>=3.0",
    "tokenizers>=0.20",
    "sentence-transformers>=3.1",
    "accelerate>=1.0",
    "peft>=0.13",
    "evaluate>=0.4",
    "safetensors>=0.4",
    "mlflow>=2.16",
    "wandb>=0.18",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "plotly>=5.24",
    "tensorboard>=2.17",
    "kagglehub>=0.3",
    "requests>=2.32",
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
]

[project.scripts]
nvp1 = "nvp1:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "olp-ai-26",
]
